{% extends "base.html" %}
{% block title %}Issue Challan{% endblock %}
{% block page_title %}Issue New Challan{% endblock %}
{% block topbar_actions %}
  <a href="{{ url_for('challans') }}" class="btn btn-ghost">← Back to Challans</a>
{% endblock %}

{% block content %}
<div style="max-width:720px">
<div class="card">
  <form method="post">
    <div class="form-grid">

      <div class="form-group">
        <label>Vehicle (Plate Number)</label>
        <select name="vehicle_id" required>
          <option value="">— Select Vehicle —</option>
          {% for v in vehicles %}
          <option value="{{ v.vehicle_id }}">{{ v.plate_number }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Traffic Officer</label>
        <select name="officer_id" required>
          <option value="">— Select Officer —</option>
          {% for o in officers %}
          <option value="{{ o.officer_id }}">{{ o.full_name }} ({{ o.badge_number }})</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Violation Type</label>
        <select name="violation_code" id="violation_sel" required onchange="setFine(this)">
          <option value="">— Select Violation —</option>
          {% for v in violations %}
          <option value="{{ v.violation_code }}" data-fine="{{ v.fine_amount }}">
            {{ v.violation_name }} — PKR {{ '{:,.0f}'.format(v.fine_amount) }}
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Location</label>
        <select name="location_id" required>
          <option value="">— Select Location —</option>
          {% for l in locations %}
          <option value="{{ l.location_id }}">{{ l.city_name }} – {{ l.sector_name }} – {{ l.road_name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Issue Date</label>
        <input type="date" name="issue_date" required
               value="{{ today }}" id="issue_date" onchange="setDueDate()"/>
      </div>

      <div class="form-group">
        <label>Due Date</label>
        <input type="date" name="due_date" required id="due_date"/>
      </div>

      <div class="form-group">
        <label>Fine Amount (PKR)</label>
        <input type="number" name="fine_amount" id="fine_amt" step="0.01" required/>
      </div>

      <div class="form-group">
        <label>Late Fee (PKR)</label>
        <input type="number" name="late_fee" value="0" step="0.01" id="late_fee" oninput="calcTotal()"/>
      </div>

      <div class="form-group">
        <label>Total Amount (PKR)</label>
        <input type="number" name="total_amount" id="total_amt" step="0.01" required/>
      </div>

      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="PENDING" selected>PENDING</option>
          <option value="PAID">PAID</option>
          <option value="DISPUTED">DISPUTED</option>
          <option value="CANCELLED">CANCELLED</option>
        </select>
      </div>

      <div class="form-group full">
        <label>Remarks (optional)</label>
        <textarea name="remarks" rows="2" placeholder="Any notes…"></textarea>
      </div>

    </div>
    <div style="margin-top:20px;display:flex;gap:10px">
      <button class="btn btn-primary" type="submit">🚦 Issue Challan</button>
      <a href="{{ url_for('challans') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
</div>

<script>
function setFine(sel) {
  const fine = sel.options[sel.selectedIndex].dataset.fine || '';
  document.getElementById('fine_amt').value = fine;
  document.getElementById('total_amt').value = fine;
}
function calcTotal() {
  const f = parseFloat(document.getElementById('fine_amt').value)||0;
  const l = parseFloat(document.getElementById('late_fee').value)||0;
  document.getElementById('total_amt').value = (f+l).toFixed(2);
}
function setDueDate() {
  const d = new Date(document.getElementById('issue_date').value);
  d.setDate(d.getDate()+15);
  document.getElementById('due_date').value = d.toISOString().split('T')[0];
}
// Set today and due date on load
window.onload = () => {
  const t = new Date();
  const iso = t.toISOString().split('T')[0];
  document.getElementById('issue_date').value = iso;
  setDueDate();
};
document.getElementById('fine_amt').addEventListener('input', calcTotal);
</script>
{% endblock %}
